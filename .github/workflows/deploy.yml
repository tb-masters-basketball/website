name: Build and deploy

# Every push and pull request checks the league data and builds the site.
# Only pushes to main deploy to GitHub Pages. If the tests or the data checks
# in scripts/build_stats.py fail, or the built site has a broken link or
# image, the build stops and nothing is deployed.
# A nightly run rebuilds and redeploys main even when nothing was pushed, so
# date-based parts stay current: the score sheets (game days from today on),
# the "next game day" panel and the calendar files.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *" # every day at 08:17 UTC (about 4 AM in Thunder Bay)

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages (PyYAML, reportlab)
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check data and compute stats
        run: python scripts/build_stats.py

      # PDFs for the season the site shows, into score-sheets/ so the Jekyll
      # build publishes them (needs reportlab, from requirements.txt).
      - name: Make score sheets
        run: scripts/make_score_sheets.sh

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Fails the build (and so the deploy) on a broken internal link, image,
      # script or anchor anywhere in the built site.
      - name: Check links and images
        run: scripts/check_links.sh

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
