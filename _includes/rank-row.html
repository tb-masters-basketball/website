{%- comment -%}
  Compact ranked player row: rank, name, team and the number.
  Usage: include rank-row.html player=p value=p.ppg_display
{%- endcomment -%}
<a class="rank-row" href="{{ '/players/' | append: include.player.id | append: '/' | relative_url }}">
  <span class="rank-row__rank">{{ include.player.rank }}</span>
  <span class="rank-row__who"><span class="rank-row__name">{{ include.player.display }}</span> <span class="rank-row__team">{{ include.player.team_name }}</span></span>
  <span class="rank-row__value">{{ include.value }}</span>
</a>
