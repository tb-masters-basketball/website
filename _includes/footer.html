<footer class="site-footer">
  <div class="scene scene--footer" aria-hidden="true"></div>
  <div class="site-footer__band">
    <div class="wrap site-footer__inner">
      <img class="site-footer__logo" src="{{ '/brand/logo/masters-wordmark-type-dark.svg' | relative_url }}" alt="Masters Thunder Bay" width="168" height="54">
      <nav class="site-footer__nav" aria-label="Footer">
        <a href="{{ '/teams/' | relative_url }}">Teams</a>
        <a href="{{ '/archive/' | relative_url }}">Past seasons</a>
        <a href="{{ '/schedule/' | relative_url }}#sheets-title">Score sheets</a>
        <a href="{{ '/rules/' | relative_url }}">League rules</a>
        {%- comment -%} Only shown once contact_url is set in _config.yml. {%- endcomment -%}
        {%- assign contact_url = site.contact_url | strip %}
        {%- if contact_url != "" %}
        <a href="{{ contact_url }}">Contact the league</a>
        {%- endif %}
      </nav>
      <p class="site-footer__meta">Masters Basketball League · Thunder Bay, Ontario</p>
    </div>
  </div>
</footer>
