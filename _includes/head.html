{%- comment -%}
  Built from brand/head-snippet.html. Every path goes through relative_url
  (absolute_url for share tags) so the site works under /website/ now and at
  the league's domain later.
{%- endcomment -%}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#032F98" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1022" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/brand/icons/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/brand/icons/favicon.ico' | relative_url }}" sizes="32x32">
<link rel="apple-touch-icon" href="{{ '/brand/icons/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/brand/site.webmanifest' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ '/brand/css/brand.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="Standings, schedule and player stats.">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/brand/social/og-image.png' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- Apply a saved theme choice before the page paints (no flash) -->
<script>
  try { var t = localStorage.getItem("mb-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
