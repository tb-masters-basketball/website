<!-- Masters Basketball: put in <head>. In Jekyll, wrap every path below in relative_url (or absolute_url for og:image) so it works under /website/ and later at the domain root. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#032F98" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1022" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/brand/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/icons/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/icons/apple-touch-icon.png">
<link rel="manifest" href="/brand/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/brand/css/brand.css">
<meta property="og:title" content="Masters Basketball · Thunder Bay">
<meta property="og:description" content="Standings, schedule and player stats.">
<meta property="og:image" content="https://[YOUR DOMAIN]/brand/social/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- Apply a saved theme choice before the page paints (no flash) -->
<script>
  try { var t = localStorage.getItem("mb-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
