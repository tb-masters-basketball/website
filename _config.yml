# Masters Basketball League · Thunder Bay
#
# While the site lives at https://tb-masters-basketball.github.io/website/,
# baseurl is "/website". To move to the league's own domain: set baseurl to ""
# and url to the domain, and add a CNAME file (see CLAUDE.md).
title: "Masters Basketball · Thunder Bay"
description: "Standings, schedule and player stats for the Masters Basketball League in Thunder Bay."
url: "https://tb-masters-basketball.github.io"
baseurl: "/website"

# Sample data switch. While true, every page reads the fake season in
# data/sample-2026-27/ and a banner under the header says so. Set it to false
# (or delete the line) once the first real game is recorded: the site then reads
# data/2026-27/ and the banner goes away. Nothing else needs to change.
sample_data: true

# Where the footer's "Contact the league" link goes (a mailto: link or a form).
# Leave it blank and the footer shows no contact link.
contact_url: ""

timezone: America/Toronto
markdown: kramdown
permalink: pretty

exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - requirements.txt
  - data/
  - docs/
  - scripts/
  - tests/
  - vendor/
  - brand/BRAND.md
  - brand/head-snippet.html
