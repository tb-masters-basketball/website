# Masters Basketball League · Thunder Bay
#
# The site lives at https://mastersbasketball.ca/ (the domain root, so baseurl
# is empty). The CNAME file next to this one names the same domain. Every
# path in the templates goes through relative_url, so changing domain again
# only means changing url here and the CNAME file.
title: "Masters Basketball · Thunder Bay"
description: "Standings, schedule and player stats for the Masters Basketball League in Thunder Bay."
url: "https://mastersbasketball.ca"
baseurl: ""

# Sample data switch. While true, every page reads the fake season in
# data/sample-2026-27/ and a banner under the header says so. Off since the
# real 2026-27 teams and schedule went in (October 2026): pages read
# data/2026-27/. Turn it back on to preview the site with sample numbers.
sample_data: false

# The hidden preview copy. true: every deploy also builds the site from the
# sample season at /preview/ (mastersbasketball.ca/preview/), with the sample
# banner, so changes can be seen with a full season of made-up numbers while
# the real site stays live. Nothing links to it, but it isn't private: anyone
# with the address can open it. scripts/build_preview.sh builds it.
preview_site: true

# Score sheet photos. Off: the box score page has no "Score sheet photo" link.
# On: scripts/build_stats.py copies the photos from data/<season>/sheets/ into
# the site and each box score links to its photo. The league keeps the photos
# in the repo (data/<season>/sheets/) but not on the site, so this stays off.
score_sheet_links: false

# Where the footer's "Contact the league" link goes (a mailto: link or a form).
# Leave it blank and the footer shows no contact link.
contact_url: ""

# Search engines. false: every page asks Google and others not to list it
# (<meta name="robots" content="noindex, nofollow">). The league doesn't want
# the site in search results. Set true to let them list it.
search_engines: false

timezone: America/Toronto
markdown: kramdown
permalink: pretty

exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - requirements.txt
  - data/
  - docs/
  - scripts/
  - tests/
  - vendor/
  - brand/BRAND.md
  - brand/head-snippet.html

# Game stubs are named by date (2026-12-03-g1.md); without this Jekyll would
# skip any dated after the day the site is built, which hides the sample season.
future: true

# One page per game, player, team and archive season. The files in these
# folders are tiny stubs written by scripts/build_stats.py (git-ignored,
# rewritten every build); each layout reads its data from _data/computed.
collections:
  games:
    output: true
    permalink: /games/:name/
  players:
    output: true
    permalink: /players/:name/
  teams:
    output: true
    permalink: /teams/:name/
  archive:
    output: true
    permalink: /archive/:name/

defaults:
  - scope: {path: "", type: games}
    values: {layout: game, nav: schedule}
  - scope: {path: "", type: players}
    values: {layout: player, nav: stats}
  - scope: {path: "", type: teams}
    values: {layout: team, nav: teams}
  - scope: {path: "", type: archive}
    values: {layout: archive-season, nav: archive}
